name: release
# Run by hand (Actions → release → Run workflow). Creates the vX.Y.Z release
# from the script's TOOL_VERSION, attaches the script and checksum, and moves
# the v1 tag the Action is referenced by.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c SHA256SUMS
      - name: Publish release with the script and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(grep -m1 '^TOOL_VERSION=' php2shell-check.sh | cut -d'"' -f2)"
          major="v${ver%%.*}"
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "v$ver already released"; exit 1
          fi
          gh release create "v$ver" php2shell-check.sh SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "php2shell-check $ver" \
            --notes "Check script $ver. SHA-256: $(cut -d' ' -f1 SHA256SUMS). Same script as https://entidex.com/downloads/php2shell-check.sh."
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
